name: Locat 2.0 Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/locat-2.0-app-lock-biometric-guard
      - feat/locat-unified-platforms
      - feat/locat-complete-ecosystem
      - release/locat-v1.0
    paths:
      - "remote/**"
      - "src/**"
      - "api/**"
      - "public/**"
      - "contracts/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "capacitor.config.json"
      - ".github/workflows/android-preview.yml"

concurrency:
  group: locat-preview-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Install isolated Capacitor 8 toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/locat-capacitor"
          npm install --prefix "$RUNNER_TEMP/locat-capacitor" --package-lock=false --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/push-notifications@8
          ln -s "$RUNNER_TEMP/locat-capacitor/node_modules/@capacitor" node_modules/@capacitor
          ln -s "$RUNNER_TEMP/locat-capacitor/node_modules/.bin/cap" node_modules/.bin/cap
      - name: Build preview web client
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: npm run build:web
      - name: Verify native media byte ranges
        run: node scripts/test-media-ranges.mjs
      - run: npx cap add android
      - run: node scripts/install-android-storage-plugin.mjs
      - run: npx cap sync android
      - name: Isolate preview package and version
        run: |
          python3 - <<'PY'
          import os, pathlib, re, time
          gradle = pathlib.Path("android/app/build.gradle")
          source = gradle.read_text()
          source, count = re.subn(r'(applicationId\s+["\x27])[^"\x27]+(["\x27])', r'\g<1>com.shaikibrahim.locat.preview\2', source, count=1)
          if count != 1:
              raise SystemExit("Preview applicationId not found; refusing to build original package")
          # UTC seconds avoid downgrade when a workflow is recreated and its
          # run counter restarts. Keep the Android signed-int bound explicit.
          version_code = int(time.time())
          if not 1_000_000_000 <= version_code <= 2_147_483_647:
              raise SystemExit("Preview version clock outside supported Android range")
          source, count = re.subn(r'(?m)^(\s*versionCode\s+)\d+', lambda m: m.group(1) + str(version_code), source, count=1)
          if count != 1:
              raise SystemExit("Android versionCode not found")
          gradle.write_text(source)
          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"LOCAT_PREVIEW_VERSION_CODE={version_code}\n")
          print("Configured isolated Locat preview package")
          PY
      - name: Require dedicated preview signing secrets
        env:
          KEYSTORE: ${{ secrets.LOCAT_PREVIEW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LOCAT_PREVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOCAT_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LOCAT_PREVIEW_KEY_PASSWORD }}
        run: |
          for value in "$KEYSTORE" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "::error::Missing Locat preview signing secret. Follow docs/ANDROID_PREVIEW_APK.md"
              exit 1
            fi
          done
      - name: Build unsigned preview release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign preview APK with persistent key
        env:
          KEYSTORE: ${{ secrets.LOCAT_PREVIEW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LOCAT_PREVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LOCAT_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LOCAT_PREVIEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/locat-preview-signing.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$keystore"
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          unsigned="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name "*unsigned.apk" -print -quit)"
          if [ -z "$unsigned" ] || [ ! -s "$unsigned" ]; then
            echo "::error::Unsigned preview APK missing; inspect Gradle outputs"
            find android/app/build/outputs/apk/release -maxdepth 1 -type f -printf "%f\n"
            exit 1
          fi
          mkdir -p preview-artifact
          "$apksigner" sign --verbose --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out preview-artifact/locat-2-preview.apk "$unsigned"
          "$apksigner" verify --verbose preview-artifact/locat-2-preview.apk
          "$apksigner" verify --verbose --print-certs preview-artifact/locat-2-preview.apk > preview-artifact/signing-certificate.txt 2>&1
      - name: Check preview application ID
        run: |
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          aapt="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -name aapt | sort -V | tail -1)"
          test -n "$aapt"
          "$aapt" dump badging preview-artifact/locat-2-preview.apk | grep "package: name='com.shaikibrahim.locat.preview'"
          "$aapt" dump badging preview-artifact/locat-2-preview.apk | grep "versionCode='$LOCAT_PREVIEW_VERSION_CODE'"
      - name: Package preview APK and metadata
        run: |
          (cd preview-artifact && sha256sum locat-2-preview.apk > locat-2-preview.apk.sha256)
          printf 'commit=%s\nrun=%s\nversionCode=%s\npackage=com.shaikibrahim.locat.preview\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$LOCAT_PREVIEW_VERSION_CODE" > preview-artifact/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: locat-2-preview-apk
          path: preview-artifact/
          if-no-files-found: error
          retention-days: 14
