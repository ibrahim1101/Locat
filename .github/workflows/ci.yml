name: Locat checks

on:
  push:
    branches: [main, feat/locat-1.0, feat/locat-2.0, chore/locat-2.0-quality]
  pull_request:
  workflow_dispatch:

concurrency:
  group: locat-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: locat_ci_root
          MARIADB_DATABASE: locat_test
          MARIADB_USER: locat
          MARIADB_PASSWORD: locat_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TEST_DATABASE_URL: mysql://locat:locat_ci_test@127.0.0.1:3306/locat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify approved Locat logo is unchanged
        run: |
          expected=c465d010524032e1ec9f37b1e9b1c2722c7237cc
          actual=$(git hash-object public/locat-official-logo.png)
          test "$actual" = "$expected" || { echo 'Approved Locat logo was modified'; exit 1; }
      - run: npm run check
      - run: npm run lint
      - name: Passwordless crypto regression tests
        run: npx vitest run src/lib/quickSignIn.test.ts src/lib/deviceLink.test.ts
      - run: npm test
      - run: npm run build
      - name: Validate additive database bootstrap on MariaDB
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          npm run db:setup
          npm run db:setup
          node --input-type=module -e '
            import mysql from "mysql2/promise";
            const db = await mysql.createConnection(process.env.DATABASE_URL);
            try {
              for (const name of ["recovery_credentials", "device_link_requests"]) {
                const [rows] = await db.execute("SELECT COUNT(*) AS n FROM information_schema.TABLES WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = ?", [name]);
                if (Number(rows[0].n) !== 1) throw new Error(`Missing table: ${name}`);
              }
              console.log("Passwordless tables present after repeated bootstrap");
            } finally { await db.end(); }
          '
      - run: bash -n scripts/install-pi.sh
      - run: bash scripts/install-pi.sh --help

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      LOCAT_DB_PASSWORD: 6f3562767ddbc7b831ac97be88b64a56
      LOCAT_DB_ROOT_PASSWORD: 0d335af4ceda705637617bbb2351ab98
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose exec -T app npm run doctor
      - run: curl --fail http://127.0.0.1:3000/api/ready
      - run: docker compose exec -T app npm run admin -- stats
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
