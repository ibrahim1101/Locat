name: Locat Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/locat-1.0]
    paths:
      - "src/**"
      - "contracts/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "vite.config.ts"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: locat-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # Full typecheck/lint/tests run in Locat checks. Keep this workflow
      # focused on proving that the native Android artifact itself builds.
      # npm 10 can hit an Arborist edgesOut crash when mutating a freshly
      # npm-ci-installed tree. Install the temporary alpha toolchain in an
      # isolated directory, then expose it to the project for Capacitor CLI use.
      - name: Install isolated Capacitor 8 toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/locat-capacitor"
          npm install --prefix "$RUNNER_TEMP/locat-capacitor" --package-lock=false --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          ln -s "$RUNNER_TEMP/locat-capacitor/node_modules/@capacitor" node_modules/@capacitor
          ln -s "$RUNNER_TEMP/locat-capacitor/node_modules/.bin/cap" node_modules/.bin/cap
      - run: npm run build:web
      - run: npx cap add android
      - name: Install Locat Android storage bridge
        run: node scripts/install-android-storage-plugin.mjs
      - run: npx cap sync android
      - name: Set monotonic Android version code
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("android/app/build.gradle")
          source = path.read_text()
          source, count = re.subn(r"(?m)^(\s*versionCode\s+)\d+", lambda m: m.group(1) + os.environ["RUN_NUMBER"], source, count=1)
          if count != 1:
              raise SystemExit("Unable to find Android versionCode")
          path.write_text(source)
          PY
      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign and verify release APK
        env:
          LOCAT_KEYSTORE_BASE64: ${{ secrets.LOCAT_KEYSTORE_BASE64 }}
          LOCAT_KEYSTORE_PASSWORD: ${{ secrets.LOCAT_KEYSTORE_PASSWORD }}
          LOCAT_KEY_ALIAS: ${{ secrets.LOCAT_KEY_ALIAS }}
          LOCAT_KEY_PASSWORD: ${{ secrets.LOCAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in LOCAT_KEYSTORE_BASE64 LOCAT_KEYSTORE_PASSWORD LOCAT_KEY_ALIAS LOCAT_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "::error::Missing required signing secret: $key"; exit 1; fi
          done
          keystore="$RUNNER_TEMP/locat-release.jks"
          printf '%s' "$LOCAT_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then echo "::error::Android apksigner not found"; exit 1; fi
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="android/app/build/outputs/apk/release/locat-release.apk"
          test -s "$unsigned"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$LOCAT_KEY_ALIAS" \
            --ks-pass env:LOCAT_KEYSTORE_PASSWORD --key-pass env:LOCAT_KEY_PASSWORD \
            --out "$signed" "$unsigned"
          "$apksigner" verify --verbose "$signed"
          rm -f "$keystore"
      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/release/locat-release.apk | tee android/app/build/outputs/apk/release/locat-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: locat-android-release
          path: |
            android/app/build/outputs/apk/release/locat-release.apk
            android/app/build/outputs/apk/release/locat-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
