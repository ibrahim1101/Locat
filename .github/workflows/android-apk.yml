name: Locat Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/locat-1.0]
    paths:
      - "src/**"
      - "contracts/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "vite.config.ts"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: locat-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # Full typecheck/lint/tests run in Locat checks. Keep this workflow
      # focused on proving that the native Android artifact itself builds.
      # npm 10 can hit an Arborist edgesOut crash when mutating a freshly
      # npm-ci-installed tree. Install the temporary alpha toolchain in an
      # isolated directory, then expose it to the project for Capacitor CLI use.
      - name: Install isolated Capacitor 8 toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/locat-capacitor"
          npm install --prefix "$RUNNER_TEMP/locat-capacitor" --package-lock=false --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/push-notifications@8
          ln -s "$RUNNER_TEMP/locat-capacitor/node_modules/@capacitor" node_modules/@capacitor
          ln -s "$RUNNER_TEMP/locat-capacitor/node_modules/.bin/cap" node_modules/.bin/cap
      - run: npm run build:web
      - run: npx cap add android
      - name: Install Locat Android storage bridge
        run: node scripts/install-android-storage-plugin.mjs
      - run: npx cap sync android
      - name: Generate Locat titanium adaptive launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          res = Path("android/app/src/main/res")
          drawable = res / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)
          artwork = """<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#D6DAE0"
              android:pathData="M38,49 C24,43 24,30 31,20 L43,27 C52,20 62,21 70,27 L80,20 C87,34 83,44 76,51 C72,55 72,60 79,67 C68,71 59,68 55,59 C51,54 46,51 38,49 Z"/>
            <path android:fillColor="#D6DAE0"
              android:pathData="M39,51 C25,54 24,70 34,78 C44,86 64,83 73,73 C67,79 56,77 52,68 C48,61 50,55 55,52 Z"/>
            <path android:strokeColor="#E8EAEE" android:strokeWidth="5"
              android:strokeLineCap="round" android:pathData="M34,79 C50,90 72,88 86,76"/>
            <path android:fillColor="#12151A" android:pathData="M45,37 m-2,0 a2,2 0,1 0,4 0 a2,2 0,1 0,-4 0"/>
            <path android:fillColor="#12151A" android:pathData="M65,37 m-2,0 a2,2 0,1 0,4 0 a2,2 0,1 0,-4 0"/>
            <path android:strokeColor="#D6DAE0" android:strokeWidth="1.7" android:strokeLineCap="round" android:pathData="M37,42 L23,38 M36,47 L22,47 M74,42 L87,38 M75,47 L89,47"/>
          </vector>"""
          (drawable / "locat_cat_mark.xml").write_text(artwork)
          values = res / "values"
          colors = values / "colors.xml"
          if colors.exists():
              source = colors.read_text()
              if 'name="locat_titanium_background"' not in source:
                  source = source.replace("</resources>", '    <color name="locat_titanium_background">#0A0B0D</color>\n</resources>')
              colors.write_text(source)
          else:
              colors.write_text('<resources><color name="locat_titanium_background">#0A0B0D</color></resources>')
          mipmap = res / "mipmap-anydpi-v26"
          mipmap.mkdir(parents=True, exist_ok=True)
          adaptive = """<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/locat_titanium_background"/>
            <foreground android:drawable="@drawable/locat_cat_mark"/>
          </adaptive-icon>"""
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              (mipmap / name).write_text(adaptive)
          ET.fromstring(artwork)
          ET.fromstring(adaptive)
          print("Locat titanium adaptive launcher generated")
          PY
      - name: Configure Firebase for Android
        env:
          LOCAT_FIREBASE_CONFIG_BASE64: ${{ secrets.LOCAT_FIREBASE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$LOCAT_FIREBASE_CONFIG_BASE64" ]; then
            echo "::error::Missing LOCAT_FIREBASE_CONFIG_BASE64 repository secret"
            exit 1
          fi
          printf '%s' "$LOCAT_FIREBASE_CONFIG_BASE64" | base64 --decode > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          expected = "com.shaikibrahim.locat"
          packages = [client.get("client_info", {}).get("android_client_info", {}).get("package_name") for client in config.get("client", [])]
          if expected not in packages:
              raise SystemExit("Firebase Android package does not match " + expected)
          print("Firebase configuration package validated")
          PY
      - name: Enable Firebase Google Services Gradle plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          root_text = root.read_text()
          app_text = app.read_text()
          marker = "classpath 'com.google.gms:google-services:4.4.4'"
          if marker not in root_text:
              anchor = "dependencies {"
              if anchor not in root_text:
                  raise SystemExit("Android root Gradle dependencies block not found")
              root_text = root_text.replace(anchor, anchor + "\n        " + marker, 1)
          apply_line = "apply plugin: 'com.google.gms.google-services'"
          if apply_line not in app_text:
              app_text += "\n" + apply_line + "\n"
          root.write_text(root_text)
          app.write_text(app_text)
          PY
      # Rebuild requested to verify stable signing across consecutive APK releases.
      - name: Set monotonic Android version code
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path("android/app/build.gradle")
          source = path.read_text()
          source, count = re.subn(r"(?m)^(\s*versionCode\s+)\d+", lambda m: m.group(1) + os.environ["RUN_NUMBER"], source, count=1)
          if count != 1:
              raise SystemExit("Unable to find Android versionCode")
          path.write_text(source)
          PY
      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Sign and verify release APK
        env:
          LOCAT_KEYSTORE_BASE64: ${{ secrets.LOCAT_KEYSTORE_BASE64 }}
          LOCAT_KEYSTORE_PASSWORD: ${{ secrets.LOCAT_KEYSTORE_PASSWORD }}
          LOCAT_KEY_ALIAS: ${{ secrets.LOCAT_KEY_ALIAS }}
          LOCAT_KEY_PASSWORD: ${{ secrets.LOCAT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in LOCAT_KEYSTORE_BASE64 LOCAT_KEYSTORE_PASSWORD LOCAT_KEY_ALIAS LOCAT_KEY_PASSWORD; do
            if [ -z "${!key}" ]; then echo "::error::Missing required signing secret: $key"; exit 1; fi
          done
          keystore="$RUNNER_TEMP/locat-release.jks"
          printf '%s' "$LOCAT_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          sdk_root="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(find "$sdk_root/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)"
          if [ -z "$apksigner" ]; then echo "::error::Android apksigner not found"; exit 1; fi
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="android/app/build/outputs/apk/release/locat-release.apk"
          test -s "$unsigned"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$LOCAT_KEY_ALIAS" \
            --ks-pass env:LOCAT_KEYSTORE_PASSWORD --key-pass env:LOCAT_KEY_PASSWORD \
            --out "$signed" "$unsigned"
          "$apksigner" verify --verbose "$signed"
          rm -f "$keystore"
      - name: Record APK checksum
        run: sha256sum android/app/build/outputs/apk/release/locat-release.apk | tee android/app/build/outputs/apk/release/locat-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: locat-android-release
          path: |
            android/app/build/outputs/apk/release/locat-release.apk
            android/app/build/outputs/apk/release/locat-release.apk.sha256
          if-no-files-found: error
          retention-days: 14
