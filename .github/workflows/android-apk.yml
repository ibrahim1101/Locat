name: Locat Android APK

on:
  workflow_dispatch:
  push:
    branches: [feat/locat-1.0]
    paths:
      - "src/**"
      - "contracts/**"
      - "public/**"
      - "package.json"
      - "vite.config.ts"
      - "capacitor.config.ts"
      - ".github/workflows/android-apk.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      # Bootstrap the native shell without changing the web dependency lock yet.
      # The generated Android project is an alpha artifact; it will be committed
      # once native plugins/custom Android code become part of Locat.
      - name: Install stable Capacitor 8 toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
      - run: npm run build:web
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: locat-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
